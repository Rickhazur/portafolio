<!DOCTYPE html>

<title>Bilingual Content Operations Hub</title>
<style>
:root{--navy:#101b32;--navy2:#172743;--blue:#3b82f6;--cyan:#65c8d0;--ink:#172033;--muted:#718096;--line:#e5eaf1;--bg:#f4f7fb;--white:#fff;--green:#15966a;--amber:#c78318;--red:#c94c54;--shadow:0 12px 34px rgba(24,39,75,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh}.sidebar{width:250px;background:var(--navy);color:#d8e2f2;padding:24px 16px;display:flex;flex-direction:column;flex-shrink:0}.brand{display:flex;align-items:center;gap:11px;padding:4px 10px 28px}.brand-mark{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,#4c8ef7,#64cbd0);display:grid;place-items:center;color:white;font-weight:800;font-size:15px}.brand strong{display:block;color:white;font-size:15px;letter-spacing:.2px}.brand small{color:#91a4c2;font-size:10px;letter-spacing:1.3px}.nav-label{font-size:10px;color:#8092af;text-transform:uppercase;letter-spacing:1.4px;padding:12px 12px 8px}.nav button{width:100%;border:0;background:transparent;color:#b9c7dc;text-align:left;padding:11px 12px;border-radius:9px;display:flex;align-items:center;gap:12px;margin:2px 0;font-size:13px}.nav button:hover,.nav button.active{background:#223657;color:white}.nav .ico{width:18px;text-align:center;font-size:16px}.sidebar-foot{margin-top:auto;border-top:1px solid #2a3b59;padding:16px 10px 0;color:#8fa2bf;font-size:11px}.demo-pill{display:inline-block;border:1px solid #46617f;border-radius:20px;padding:3px 8px;color:#9edbe0;font-size:9px;letter-spacing:1px;margin-bottom:9px}.main{flex:1;min-width:0}.topbar{height:70px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px;position:sticky;top:0;z-index:5}.crumb{color:var(--muted);font-size:12px}.top-actions{display:flex;align-items:center;gap:16px}.top-actions .today{color:var(--muted);font-size:12px}.avatar{width:34px;height:34px;border-radius:50%;background:#e4efff;color:#2456a6;display:grid;place-items:center;font-weight:700}.content{padding:30px 34px 60px;max-width:1500px;margin:auto}.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:24px}.eyebrow{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--blue);font-weight:700}.page-head h1{margin:5px 0 5px;font-size:27px;letter-spacing:-.6px}.sub{color:var(--muted);margin:0}.btn{border:1px solid var(--line);background:white;color:#34415a;border-radius:8px;padding:9px 13px;font-weight:600;font-size:12px}.btn:hover{border-color:#9eb9e6}.btn.primary{background:var(--blue);border-color:var(--blue);color:white}.btn.dark{background:var(--navy2);border-color:var(--navy2);color:white}.btn.small{padding:6px 9px;font-size:11px}.btn.ghost{background:transparent}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:20px}.stat{background:white;border:1px solid var(--line);border-radius:12px;padding:17px 18px;box-shadow:0 3px 12px rgba(20,40,80,.025)}.stat-top{display:flex;justify-content:space-between;color:var(--muted);font-size:11px}.stat-icon{width:29px;height:29px;border-radius:9px;background:#edf4ff;display:grid;place-items:center;color:#3676d9}.stat-num{font-size:27px;font-weight:750;margin:8px 0 2px;letter-spacing:-.7px}.stat-note{font-size:10px;color:var(--muted)}.stat-note.good{color:var(--green)}.panel{background:white;border:1px solid var(--line);border-radius:12px;box-shadow:0 3px 12px rgba(20,40,80,.025);margin-bottom:18px;overflow:hidden}.panel-head{padding:17px 19px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}.panel-head h2{font-size:14px;margin:0}.panel-head p{margin:3px 0 0;color:var(--muted);font-size:11px}.panel-body{padding:18px 19px}.two-col{display:grid;grid-template-columns:1.45fr 1fr;gap:18px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th{text-align:left;color:#8490a3;font-size:10px;text-transform:uppercase;letter-spacing:.7px;font-weight:700;padding:11px 14px;background:#fbfcfe;border-bottom:1px solid var(--line)}td{padding:12px 14px;border-bottom:1px solid #eef1f5;font-size:12px}tr:last-child td{border-bottom:0}.video-title{font-weight:650;color:#24324b}.video-id{color:#98a2b2;font-size:10px;margin-top:2px}.status{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:4px 8px;font-size:10px;font-weight:650}.status:before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}.s-received{background:#f0f2f6;color:#657287}.s-editing{background:#eaf2ff;color:#3975cc}.s-review{background:#fff5df;color:#b47b1d}.s-revision{background:#fff0ef;color:#c14e4e}.s-approved{background:#e8f7f0;color:#16865d}.s-scheduled{background:#f0eefe;color:#7162bd}.s-published{background:#e6f7f6;color:#16878b}.lang{font-size:10px;font-weight:700;color:#5b6980;background:#f2f5f8;padding:4px 7px;border-radius:5px}.progress-row{display:flex;justify-content:space-between;font-size:11px;margin:13px 0 6px}.bar{height:7px;background:#edf1f6;border-radius:20px;overflow:hidden}.bar span{display:block;height:100%;background:linear-gradient(90deg,#4d88e8,#67c7cf);border-radius:20px}.activity{display:flex;gap:11px;padding:10px 0;border-bottom:1px solid #eff2f6}.activity:last-child{border:0}.activity-dot{width:8px;height:8px;border-radius:50%;background:#5b9ce9;margin-top:5px;flex-shrink:0}.activity strong{font-size:11px}.activity p{margin:2px 0;color:var(--muted);font-size:10px}.activity time{margin-left:auto;color:#9aa4b2;font-size:10px;white-space:nowrap}.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.field,select,textarea{border:1px solid #dfe5ee;border-radius:8px;padding:9px 10px;background:white;color:#28364d;font-size:12px;outline:none}.field:focus,select:focus,textarea:focus{border-color:#79a7ed;box-shadow:0 0 0 3px #eaf2ff}.field{min-width:190px}.select-sm{min-width:125px}.module-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.module-card{background:white;border:1px solid var(--line);border-radius:12px;padding:18px;cursor:pointer;transition:.18s}.module-card:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:#b9ccec}.module-icon{width:38px;height:38px;border-radius:11px;background:#edf4ff;color:#3979dc;display:grid;place-items:center;font-size:18px;margin-bottom:13px}.module-card h3{margin:0 0 5px;font-size:14px}.module-card p{margin:0;color:var(--muted);font-size:11px}.module-card .count{margin-top:15px;color:#4779c7;font-size:11px;font-weight:700}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.form-field{display:flex;flex-direction:column;gap:5px}.form-field label{font-size:11px;color:#647188;font-weight:650}.form-field.full{grid-column:1/-1}textarea{min-height:86px;resize:vertical}.checklist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.check-item{display:flex;align-items:center;gap:9px;padding:10px;border:1px solid var(--line);border-radius:8px;font-size:11px}.check-item input{accent-color:var(--blue)}.qc-score{font-size:35px;font-weight:800;letter-spacing:-1px}.score-label{font-size:10px;color:var(--muted)}.caption-box{background:#f7f9fc;border:1px solid var(--line);padding:15px;border-radius:9px;font-size:13px;white-space:pre-wrap;min-height:90px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.day{border:1px solid var(--line);border-radius:8px;min-height:104px;padding:8px;background:white}.day-name{font-size:9px;color:#8792a4;text-transform:uppercase}.day-num{font-size:12px;font-weight:700;margin:4px 0 8px}.event{font-size:9px;background:#eaf2ff;color:#3268b4;padding:4px 5px;border-radius:4px;margin:3px 0;white-space:normal}.event.es{background:#e7f7f3;color:#168467}.empty{padding:35px;text-align:center;color:var(--muted);font-size:12px}.modal-backdrop{position:fixed;inset:0;background:#0d1830a8;display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal-backdrop.show{display:flex}.modal{background:white;border-radius:14px;width:min(640px,100%);max-height:90vh;overflow:auto;box-shadow:0 25px 80px #07122666}.modal-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.modal-head h2{font-size:16px;margin:0}.modal-body{padding:20px}.modal-foot{padding:15px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}.toast{position:fixed;bottom:22px;right:22px;background:#13233d;color:white;padding:12px 16px;border-radius:9px;box-shadow:var(--shadow);font-size:12px;opacity:0;transform:translateY(8px);transition:.2s;z-index:40}.toast.show{opacity:1;transform:translateY(0)}.muted{color:var(--muted)}.section-intro{margin:-8px 0 18px;color:var(--muted);font-size:12px}.inline-actions{display:flex;gap:6px}.tag{font-size:10px;color:#6f7d91;background:#f1f4f8;border-radius:5px;padding:4px 7px}.notice{border:1px solid #dce9fb;background:#f4f8ff;color:#4a6285;border-radius:9px;padding:11px 13px;font-size:11px;margin-bottom:16px}.notice strong{color:#2c5eaa}
@media(max-width:1000px){.sidebar{width:210px}.content{padding:24px 20px}.cards{grid-template-columns:repeat(2,1fr)}.two-col{grid-template-columns:1fr}.module-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:680px){.app{display:block}.sidebar{width:100%;padding:12px;display:block}.brand{padding:4px 8px 12px}.nav{display:flex;overflow:auto;gap:4px}.nav-label,.sidebar-foot{display:none}.nav button{white-space:nowrap;width:auto;padding:9px}.nav button .ico{display:none}.topbar{height:55px;padding:0 16px}.top-actions .today{display:none}.content{padding:20px 14px}.page-head{display:block}.page-head>.btn{margin-top:14px}.cards{gap:9px}.stat{padding:13px}.stat-num{font-size:23px}.module-grid{grid-template-columns:1fr}.form-grid,.checklist{grid-template-columns:1fr}.day{min-height:78px;padding:5px}.event{font-size:8px}.calendar{gap:3px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
 <div class="brand"><div class="brand-mark">BCO</div><div><strong>Bilingual Content</strong><small>OPERATIONS HUB</small></div></div>
 <div class="nav-label">Workspace</div>
 <nav class="nav" id="nav">
  <button class="active" data-page="overview"><span class="ico">▦</span>Overview</button>
  <button data-page="intake"><span class="ico">⇩</span>Video Intake</button>
  <button data-page="tracker"><span class="ico">◫</span>Production Tracker</button>
  <button data-page="quality"><span class="ico">✓</span>Quality Control</button>
  <button data-page="captions"><span class="ico">✎</span>AI Caption Studio</button>
  <button data-page="revisions"><span class="ico">↻</span>Revision Manager</button>
  <button data-page="calendar"><span class="ico">▣</span>Publishing Calendar</button>
 </nav>
 <div class="sidebar-foot"><span class="demo-pill">DEMO ENVIRONMENT</span><br>Sample Content Team<br><span style="opacity:.7">Sample data · Local prototype</span></div>
</aside>
<main class="main">
 <header class="topbar"><div class="crumb">Workspace <span style="color:#c2cad5"> / </span> <strong id="crumb">Overview</strong></div><div class="top-actions"><span class="today" id="today"></span><div class="avatar">RT</div></div></header>
 <div class="content" id="view"></div>
</main>
</div>
<div class="modal-backdrop" id="modal"><div class="modal"><div class="modal-head"><h2 id="modal-title">Details</h2><button class="btn small" onclick="closeModal()">✕</button></div><div class="modal-body" id="modal-body"></div><div class="modal-foot" id="modal-foot"></div></div></div>
<div class="toast" id="toast"></div>
<script>
const initialVideos=[
{id:'VID-024',title:'2024 Toyota RAV4 — Walkaround',dealer:'Coastal Toyota',language:'English',platform:'Instagram',status:'Approved',owner:'Maria',due:'2026-11-20',notes:'Highlight safety features and interior space.',caption:'Meet the 2024 Toyota RAV4. Smart technology, confident performance, and room for every adventure. Visit us today.',checks:{audio:true,captions:true,grammar:true,branding:true,brief:true}},
{id:'VID-023',title:'Financiamiento fácil — Video corto',dealer:'Sunrise Auto Group',language:'Spanish',platform:'Facebook',status:'In Review',owner:'Carlos',due:'2026-11-20',notes:'Confirm natural Spanish phrasing and on-screen offer.',caption:'¿Buscas opciones para tu próximo vehículo? Nuestro equipo puede ayudarte a encontrar una alternativa que se ajuste a tus necesidades. ¡Visítanos!',checks:{audio:true,captions:false,grammar:true,branding:true,brief:true}},
{id:'VID-022',title:'Customer testimonial — Elena',dealer:'Bay Motors',language:'Spanish',platform:'TikTok',status:'Revision',owner:'Maria',due:'2026-11-19',notes:'Correct caption punctuation and check the final audio cut.',caption:'Una experiencia de compra sencilla, transparente y pensada para ti.',checks:{audio:true,captions:false,grammar:true,branding:false,brief:true}},
{id:'VID-021',title:'Trade-in value explained',dealer:'Coastal Toyota',language:'English',platform:'Instagram',status:'Editing',owner:'Editor Team',due:'2026-11-21',notes:'Add closing CTA and dealership logo.',caption:'',checks:{}},
{id:'VID-020',title:'SUV familiar: espacio y comodidad',dealer:'Metro Chevrolet',language:'Spanish',platform:'Facebook',status:'Scheduled',owner:'Carlos',due:'2026-11-22',notes:'Approved for weekend publishing.',caption:'Descubre el espacio y la comodidad que tu familia necesita. Conoce nuestras opciones hoy.',checks:{audio:true,captions:true,grammar:true,branding:true,brief:true}},
{id:'VID-019',title:'Service department introduction',dealer:'Bay Motors',language:'English',platform:'Instagram',status:'Published',owner:'Maria',due:'2026-11-18',notes:'Published successfully.',caption:'Expert care for every mile. Meet the service team at Bay Motors.',checks:{audio:true,captions:true,grammar:true,branding:true,brief:true}},
{id:'VID-018',title:'Consejos para elegir tu primer auto',dealer:'Sunrise Auto Group',language:'Spanish',platform:'TikTok',status:'Received',owner:'Unassigned',due:'2026-11-23',notes:'New footage received. Needs initial review.',caption:'',checks:{}}
];
let videos=JSON.parse(localStorage.getItem('dclVideos')||'null')||initialVideos;
let revisions=JSON.parse(localStorage.getItem('dclRevisions')||'null')||[
{id:'REV-008',video:'VID-022',issue:'Caption punctuation and final audio cut',assigned:'Editor Team',priority:'High',status:'Open',date:'2026-11-19'},
{id:'REV-007',video:'VID-023',issue:'Spanish caption timing does not match spoken phrase',assigned:'Editor Team',priority:'Medium',status:'In Progress',date:'2026-11-19'}
];
let current='overview';
const $=s=>document.querySelector(s);
function save(){localStorage.setItem('dclVideos',JSON.stringify(videos));localStorage.setItem('dclRevisions',JSON.stringify(revisions))}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function statusClass(s){return ({'Received':'s-received','Editing':'s-editing','In Review':'s-review','Revision':'s-revision','Approved':'s-approved','Scheduled':'s-scheduled','Published':'s-published'})[s]||'s-received'}
function pill(s){return `<span class="status ${statusClass(s)}">${esc(s)}</span>`}
function pageHead(kicker,title,desc,action=''){return `<div class="page-head"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><p class="sub">${desc}</p></div>${action}</div>`}
function stat(label,num,note,ico){return `<div class="stat"><div class="stat-top"><span>${label}</span><span class="stat-icon">${ico}</span></div><div class="stat-num">${num}</div><div class="stat-note">${note}</div></div>`}
function videoTable(list,actions=true){if(!list.length)return `<div class="empty">No videos match your filters.</div>`;return `<div class="table-wrap"><table><thead><tr><th>Video</th><th>Language</th><th>Status</th><th>Due date</th><th>Owner</th>${actions?'<th>Action</th>':''}</tr></thead><tbody>${list.map(v=>`<tr><td><div class="video-title">${esc(v.title)}</div><div class="video-id">${v.id} · ${esc(v.dealer)}</div></td><td><span class="lang">${v.language==='Spanish'?'ES':'EN'}</span></td><td>${pill(v.status)}</td><td>${esc(v.due)}</td><td>${esc(v.owner)}</td>${actions?`<td><button class="btn small" onclick="openVideo('${v.id}')">Open</button></td>`:''}</tr>`).join('')}</tbody></table></div>`}
function render(){const names={overview:'Overview',intake:'Video Intake',tracker:'Production Tracker',quality:'Quality Control',captions:'AI Caption Studio',revisions:'Revision Manager',calendar:'Publishing Calendar'};$('#crumb').textContent=names[current];document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===current));$('#today').textContent=new Date().toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'});$('#view').innerHTML=({overview, intake,tracker,quality,captions,revisions:revisionsPage,calendar})[current](); }
function overview(){let count=s=>videos.filter(v=>v.status===s).length;return pageHead('OPERATIONS DASHBOARD','Good work starts with a clear workflow.','Monitor incoming footage, editing, bilingual review, and publishing.','<button class="btn primary" onclick="go(&quot;intake&quot;)">＋ Add video</button>')+`<div class="cards">${stat('Total videos',videos.length,'Across all workflow stages','▣')}${stat('In production',count('Editing')+count('In Review')+count('Revision'),'Editing, review or revision','◷')}${stat('Awaiting approval',count('In Review')+count('Revision'),'Needs quality attention','✓')}${stat('Published',count('Published'),'Completed content','↗')}</div><div class="two-col"><section class="panel"><div class="panel-head"><div><h2>Production overview</h2><p>Latest video activity across the team</p></div><button class="btn small" onclick="go('tracker')">View tracker →</button></div>${videoTable([...videos].sort((a,b)=>b.id.localeCompare(a.id)).slice(0,5))}</section><section class="panel"><div class="panel-head"><div><h2>Workflow health</h2><p>Video distribution by current stage</p></div></div><div class="panel-body">${[['Received','Received'],['Editing','Editing'],['In Review','In Review'],['Revision','Revision'],['Approved','Approved'],['Scheduled','Scheduled'],['Published','Published']].map(([s,l])=>{let n=count(s);return `<div class="progress-row"><span>${l}</span><strong>${n}</strong></div><div class="bar"><span style="width:${videos.length?n/videos.length*100:0}%"></span></div>`}).join('')}</div></section></div><div class="two-col"><section class="panel"><div class="panel-head"><div><h2>Needs attention</h2><p>Items that may block publishing</p></div><span class="tag">${count('Revision')+count('In Review')} items</span></div><div class="panel-body">${videos.filter(v=>['Revision','In Review'].includes(v.status)).map(v=>`<div class="activity"><span class="activity-dot" style="background:${v.status==='Revision'?'#d85b5b':'#d49a32'}"></span><div><strong>${esc(v.title)}</strong><p>${v.id} · ${esc(v.notes)}</p></div>${pill(v.status)}</div>`).join('')||'<div class="empty">All clear.</div>'}</div></section><section class="panel"><div class="panel-head"><div><h2>Recent activity</h2><p>Sample team updates</p></div></div><div class="panel-body"><div class="activity"><span class="activity-dot"></span><div><strong>VID-024 approved</strong><p>Quality review completed by Maria</p></div><time>Today</time></div><div class="activity"><span class="activity-dot"></span><div><strong>VID-022 revision requested</strong><p>Caption and audio changes sent to editor</p></div><time>Today</time></div><div class="activity"><span class="activity-dot"></span><div><strong>VID-018 footage received</strong><p>New Spanish-language video added</p></div><time>Yesterday</time></div></div></section></div>`}
function intake(){return pageHead('MODULE 01','Video Intake','Log new footage and capture the details the editor needs.','<button class="btn primary" onclick="newVideo()">＋ Register footage</button>')+`<div class="notice"><strong>Intake principle:</strong> Every file gets a unique ID, clear language label, owner, deadline, and editing brief before it enters production.</div><div class="cards">${stat('New footage',videos.filter(v=>v.status==='Received').length,'Waiting for initial processing','⇩')}${stat('Spanish videos',videos.filter(v=>v.language==='Spanish').length,'Bilingual review required','ES')}${stat('English videos',videos.filter(v=>v.language==='English').length,'English-language review','EN')}${stat('Unassigned',videos.filter(v=>v.owner==='Unassigned').length,'Needs an owner','!')}</div><section class="panel"><div class="panel-head"><div><h2>Intake register</h2><p>All incoming and active video records</p></div></div>${videoTable(videos)}</section>`}
function tracker(){return pageHead('MODULE 02','Production Tracker','See exactly where every video sits in the production pipeline.','<button class="btn" onclick="exportCSV()">↓ Export tracker</button>')+`<div class="toolbar" style="margin-bottom:14px"><input class="field" id="trackerSearch" placeholder="Search title, dealer or ID..." oninput="filterTracker()"><select class="select-sm" id="trackerStatus" onchange="filterTracker()"><option value="">All statuses</option>${['Received','Editing','In Review','Revision','Approved','Scheduled','Published'].map(s=>`<option>${s}</option>`).join('')}</select><select class="select-sm" id="trackerLang" onchange="filterTracker()"><option value="">All languages</option><option>Spanish</option><option>English</option></select></div><section class="panel" id="trackerTable">${videoTable(videos)}</section><div class="notice">Use <strong>Open</strong> on any record to update its owner, status, due date, and production notes. Changes are saved in this browser.</div>`}
function filterTracker(){let q=$('#trackerSearch').value.toLowerCase(),s=$('#trackerStatus').value,l=$('#trackerLang').value;let a=videos.filter(v=>(!q||[v.title,v.dealer,v.id].join(' ').toLowerCase().includes(q))&&(!s||v.status===s)&&(!l||v.language===l));$('#trackerTable').innerHTML=videoTable(a)}
function quality(){let list=videos.filter(v=>['In Review','Revision','Approved'].includes(v.status));return pageHead('MODULE 03','Bilingual Quality Control','A consistent review checklist for audio, captions, language, branding, and brief alignment.','')+`<div class="notice"><strong>Human review required:</strong> AI can support transcription and drafting, but a fluent reviewer must verify meaning, regional naturalness, and what is actually spoken in the video.</div><section class="panel"><div class="panel-head"><div><h2>Videos ready for quality review</h2><p>Select a video to complete its review checklist</p></div></div>${videoTable(list)}</section><section class="panel"><div class="panel-head"><div><h2>Quality standards</h2><p>What the reviewer checks before approval</p></div></div><div class="panel-body"><div class="checklist">${['Audio is clear; no clipped words or distracting noise','Captions match the spoken words and timing','Spanish or English grammar, spelling, and punctuation are correct','Language sounds natural for the intended audience','Branding, logo, and visual style follow the brief','Video matches the dealer brief and includes the correct CTA'].map(x=>`<div class="check-item"><span style="color:#22966c">✓</span>${x}</div>`).join('')}</div></div></section>`}
function captions(){return pageHead('MODULE 04','AI Caption Studio','Create a first-draft social caption, then review it for accuracy and brand fit.','')+`<div class="notice"><strong>Prototype note:</strong> This demo uses a local template-based caption assistant, not a live AI API. It does not send your text to an external service.</div><div class="two-col"><section class="panel"><div class="panel-head"><div><h2>Caption generator</h2><p>Enter the video context to create a draft</p></div></div><div class="panel-body"><div class="form-grid"><div class="form-field"><label>Video / dealer</label><select id="capVideo" onchange="loadCaptionContext()"><option value="">Select a video</option>${videos.map(v=>`<option value="${v.id}">${v.id} · ${esc(v.dealer)}</option>`).join('')}</select></div><div class="form-field"><label>Language</label><select id="capLang" onchange="capLangChanged()"><option>Spanish</option><option>English</option></select></div><div class="form-field full"><label>Video topic / key message</label><input class="field" style="width:100%" id="capTopic" placeholder="e.g. family SUV, safety features, flexible financing"></div><div class="form-field full"><label>Call to action</label><input class="field" style="width:100%" id="capCTA" value="Visit us today or send us a message."></div><div class="form-field"><label>Platform</label><select id="capPlatform"><option>Instagram</option><option>Facebook</option><option>TikTok</option></select></div><div class="form-field"><label>Tone</label><select id="capTone"><option>Friendly and professional</option><option>Energetic</option><option>Informative</option></select></div></div><div style="display:flex;justify-content:flex-end;margin-top:15px"><button class="btn primary" onclick="generateCaption()">✦ Generate draft</button></div></div></section><section class="panel"><div class="panel-head"><div><h2>Caption draft</h2><p>Review before using or publishing</p></div><span class="tag">AI-assisted concept</span></div><div class="panel-body"><div id="captionOutput" class="caption-box">Your generated caption will appear here.</div><div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><button class="btn small" onclick="copyCaption()">Copy caption</button><button class="btn small primary" onclick="saveCaption()">Save to selected video</button></div><p class="muted" style="font-size:10px;margin-top:13px">Always verify claims, offers, spelling, accents, and platform-specific requirements with the original video and approved dealer brief.</p></div></section></div>`}
function revisionsPage(){return pageHead('MODULE 05','Revision Manager','Turn review findings into clear, trackable instructions for the editor.','<button class="btn primary" onclick="newRevision()">＋ New revision</button>')+`<div class="cards">${stat('Open revisions',revisions.filter(r=>r.status==='Open').length,'Waiting for editor action','!')}${stat('In progress',revisions.filter(r=>r.status==='In Progress').length,'Being corrected','↻')}${stat('Resolved',revisions.filter(r=>r.status==='Resolved').length,'Closed items','✓')}${stat('High priority',revisions.filter(r=>r.priority==='High'&&r.status!=='Resolved').length,'Needs quick attention','↑')}</div><section class="panel"><div class="panel-head"><div><h2>Revision log</h2><p>Record the issue, action required, owner, and status</p></div></div><div class="table-wrap"><table><thead><tr><th>Reference</th><th>Video</th><th>Issue / requested change</th><th>Assigned to</th><th>Priority</th><th>Status</th><th></th></tr></thead><tbody>${revisions.map(r=>`<tr><td><strong>${r.id}</strong><div class="video-id">${r.date}</div></td><td>${r.video}</td><td style="white-space:normal;min-width:180px">${esc(r.issue)}</td><td>${esc(r.assigned)}</td><td><span class="tag">${r.priority}</span></td><td>${r.status==='Resolved'?'<span class="status s-approved">Resolved</span>':`<span class="status ${r.status==='Open'?'s-revision':'s-editing'}">${r.status}</span>`}</td><td><button class="btn small" onclick="cycleRevision('${r.id}')">Update</button></td></tr>`).join('')}</tbody></table></div></section><div class="notice">Good revision instructions identify the exact timestamp or phrase, explain the problem, and state the requested correction. Avoid vague feedback such as “please fix the Spanish.”</div>`}
function calendar(){let start=new Date(2026,10,16);let days=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];let cells='';for(let i=0;i<7;i++){let d=new Date(start);d.setDate(start.getDate()+i);let ds=d.toISOString().slice(0,10);let ev=videos.filter(v=>v.due===ds||v.status==='Published'&&v.due===ds);cells+=`<div class="day"><div class="day-name">${days[i]}</div><div class="day-num">${d.getDate()}</div>${ev.map(v=>`<div class="event ${v.language==='Spanish'?'es':''}" title="${esc(v.title)}">${esc(v.id)} · ${esc(v.platform)}</div>`).join('')}</div>`}return pageHead('MODULE 06','Publishing Calendar','A weekly view of planned content and publishing commitments.','<button class="btn" onclick="go(&quot;tracker&quot;)">View all videos</button>')+`<section class="panel"><div class="panel-head"><div><h2>November 16–22, 2026</h2><p>Sample schedule · Due dates and planned content</p></div><span class="tag">Week view</span></div><div class="panel-body"><div class="calendar">${cells}</div></div></section><section class="panel"><div class="panel-head"><div><h2>Upcoming scheduled content</h2><p>Approved videos ready to go live</p></div></div>${videoTable(videos.filter(v=>['Approved','Scheduled'].includes(v.status)))}</section>`}
function go(p){current=p;render();window.scrollTo(0,0)}
$('#nav').addEventListener('click',e=>{let b=e.target.closest('button[data-page]');if(b)go(b.dataset.page)});
function toast(s){let t=$('#toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2300)}
function showModal(title,body,foot){$('#modal-title').textContent=title;$('#modal-body').innerHTML=body;$('#modal-foot').innerHTML=foot;$('#modal').classList.add('show')}
function closeModal(){$('#modal').classList.remove('show')}
function updateQCScore(){let ids=['qcAudio','qcCaptions','qcGrammar','qcBranding','qcBrief'];let n=ids.filter(id=>{let el=document.getElementById(id);return el&&el.checked}).length;let s=document.getElementById('qcScore');if(s)s.textContent=n+'/5'}
function dealerOptions(sel){let ds=[...new Set(videos.map(v=>v.dealer).filter(Boolean))].sort();return ds.map(d=>`<option ${d===sel?'selected':''}>${esc(d)}</option>`).join('')+`<option value="__new__">＋ New dealer...</option>`}
function dealerChanged(p){let s=document.getElementById(p+'Dealer'),n=document.getElementById(p+'DealerNew');if(n)n.style.display=s.value==='__new__'?'block':'none'}
function dealerValue(p){let s=document.getElementById(p+'Dealer');if(s.value==='__new__'){let n=document.getElementById(p+'DealerNew');return (n.value||'').trim()||'Dealer not specified'}return s.value}
function openVideo(id){let v=videos.find(x=>x.id===id);showModal(`${v.id} · Video details`, `<div class="form-grid"><div class="form-field full"><label>Video title</label><input class="field" id="vTitle" style="width:100%" value="${esc(v.title)}"></div><div class="form-field"><label>Dealer</label><select id="vDealer" onchange="dealerChanged('v')">${dealerOptions(v.dealer)}</select><input class="field" id="vDealerNew" style="width:100%;display:none;margin-top:6px" placeholder="New dealer name"></div><div class="form-field"><label>Language</label><select id="vLang"><option ${v.language==='Spanish'?'selected':''}>Spanish</option><option ${v.language==='English'?'selected':''}>English</option></select></div><div class="form-field"><label>Status</label><select id="vStatus">${['Received','Editing','In Review','Revision','Approved','Scheduled','Published'].map(s=>`<option ${v.status===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="form-field"><label>Owner</label><input class="field" id="vOwner" style="width:100%" value="${esc(v.owner)}"></div><div class="form-field"><label>Due date</label><input class="field" type="date" id="vDue" style="width:100%" value="${v.due}"></div><div class="form-field"><label>Platform</label><select id="vPlatform">${['Instagram','Facebook','TikTok','YouTube'].map(s=>`<option ${v.platform===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="form-field full"><label>Production notes / editor brief</label><textarea id="vNotes">${esc(v.notes)}</textarea></div><div class="form-field full"><label>Quality checklist — tick what passed</label><div class="checklist"><label class="check-item"><input type="checkbox" id="qcAudio" ${(v.checks||{}).audio?'checked':''} onchange="updateQCScore()"> Audio clear</label><label class="check-item"><input type="checkbox" id="qcCaptions" ${(v.checks||{}).captions?'checked':''} onchange="updateQCScore()"> Captions match spoken words</label><label class="check-item"><input type="checkbox" id="qcGrammar" ${(v.checks||{}).grammar?'checked':''} onchange="updateQCScore()"> Grammar, spelling &amp; punctuation</label><label class="check-item"><input type="checkbox" id="qcBranding" ${(v.checks||{}).branding?'checked':''} onchange="updateQCScore()"> Branding &amp; logo</label><label class="check-item"><input type="checkbox" id="qcBrief" ${(v.checks||{}).brief?'checked':''} onchange="updateQCScore()"> Matches brief &amp; CTA</label></div><div style="margin-top:12px"><span class="qc-score" id="qcScore">0/5</span> <span class="score-label">checks passed</span></div></div></div>`, `<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveVideo('${id}')">Save changes</button>`);updateQCScore()}
function saveVideo(id){let v=videos.find(x=>x.id===id);v.title=$('#vTitle').value;v.dealer=dealerValue('v');v.language=$('#vLang').value;v.status=$('#vStatus').value;v.owner=$('#vOwner').value;v.due=$('#vDue').value;v.platform=$('#vPlatform').value;v.notes=$('#vNotes').value;v.checks={audio:$('#qcAudio').checked,captions:$('#qcCaptions').checked,grammar:$('#qcGrammar').checked,branding:$('#qcBranding').checked,brief:$('#qcBrief').checked};save();closeModal();render();toast('Video record updated.')}
function newVideo(){showModal('Register new footage',`<div class="form-grid"><div class="form-field full"><label>Video title</label><input class="field" id="nTitle" style="width:100%" placeholder="e.g. New model walkaround"></div><div class="form-field"><label>Dealer</label><select id="nDealer" onchange="dealerChanged('n')">${dealerOptions('')}</select><input class="field" id="nDealerNew" style="width:100%;display:none;margin-top:6px" placeholder="New dealer name"></div><div class="form-field"><label>Language</label><select id="nLang"><option>Spanish</option><option>English</option></select></div><div class="form-field"><label>Platform</label><select id="nPlatform"><option>Instagram</option><option>Facebook</option><option>TikTok</option></select></div><div class="form-field"><label>Due date</label><input class="field" type="date" id="nDue" value="2026-11-24"></div><div class="form-field"><label>Owner</label><input class="field" id="nOwner" style="width:100%" value="Unassigned"></div><div class="form-field full"><label>Brief / notes</label><textarea id="nNotes" placeholder="Key message, CTA, brand requirements..."></textarea></div></div>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="addVideo()">Add to intake</button>`)}
function addVideo(){let title=$('#nTitle').value.trim();if(!title){toast('Please enter a video title.');return}let num=Math.max(...videos.map(v=>Number(v.id.split('-')[1])||0))+1;videos.unshift({id:'VID-'+String(num).padStart(3,'0'),title,dealer:dealerValue('n'),language:$('#nLang').value,platform:$('#nPlatform').value,status:'Received',owner:$('#nOwner').value||'Unassigned',due:$('#nDue').value,notes:$('#nNotes').value,caption:'',checks:{}});save();closeModal();render();toast('New footage registered.')}
function newRevision(){showModal('Create revision request',`<div class="form-grid"><div class="form-field"><label>Video</label><select id="rVideo">${videos.map(v=>`<option>${v.id}</option>`).join('')}</select></div><div class="form-field"><label>Assigned to</label><input class="field" id="rAssigned" style="width:100%" value="Editor Team"></div><div class="form-field full"><label>Issue and requested correction</label><textarea id="rIssue" placeholder="Describe the exact issue and what needs to change..."></textarea></div><div class="form-field"><label>Priority</label><select id="rPriority"><option>Medium</option><option>High</option><option>Low</option></select></div></div>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="addRevision()">Create request</button>`)}
function addRevision(){let issue=$('#rIssue').value.trim();if(!issue){toast('Describe the requested correction.');return}let n=Math.max(0,...revisions.map(r=>Number(r.id.split('-')[1])||0))+1;revisions.unshift({id:'REV-'+String(n).padStart(3,'0'),video:$('#rVideo').value,issue,assigned:$('#rAssigned').value,priority:$('#rPriority').value,status:'Open',date:new Date().toISOString().slice(0,10)});let v=videos.find(x=>x.id===$('#rVideo').value);if(v&&v.status!=='Published')v.status='Revision';save();closeModal();render();toast('Revision request created.')}
function cycleRevision(id){let r=revisions.find(x=>x.id===id);r.status=r.status==='Open'?'In Progress':r.status==='In Progress'?'Resolved':'Open';if(r.status==='Resolved'){let open=revisions.some(x=>x.video===r.video&&x.id!==r.id&&x.status!=='Resolved');let v=videos.find(x=>x.id===r.video);if(v&&!open&&v.status==='Revision')v.status='In Review'}save();render();toast('Revision status: '+r.status)}
const CTA_DEFAULTS={Spanish:'Visítanos hoy o envíanos un mensaje.',English:'Visit us today or send us a message.'};
function capLangChanged(){$('#capCTA').value=CTA_DEFAULTS[$('#capLang').value]}
function loadCaptionContext(){let v=videos.find(x=>x.id===$('#capVideo').value);if(v){$('#capLang').value=v.language;$('#capPlatform').value=v.platform;$('#capTopic').value=v.title;$('#capCTA').value=CTA_DEFAULTS[v.language];}}
function generateCaption(){let lang=$('#capLang').value,topic=$('#capTopic').value.trim(),cta=$('#capCTA').value.trim()||CTA_DEFAULTS[lang],tone=$('#capTone').value;if(!topic){toast('Add a video topic first.');return}let text=lang==='Spanish'?`${tone==='Energetic'?'¡Prepárate para descubrirlo! ':tone==='Informative'?'Conoce más sobre ':'Descubre '}${topic}. ${cta}`:`${tone==='Energetic'?'Get ready to check it out! ':tone==='Informative'?'Learn more about ':'Discover '}${topic}. ${cta}`;$('#captionOutput').textContent=text;window.currentCaption=text;toast('Caption draft generated.')}
function copyCaption(){let t=$('#captionOutput').textContent;if(!t||t==='Your generated caption will appear here.'){toast('Generate a caption first.');return}navigator.clipboard?.writeText(t).then(()=>toast('Caption copied.')).catch(()=>toast('Select and copy the caption manually.'))}
function saveCaption(){let id=$('#capVideo').value;if(!id||!window.currentCaption){toast('Select a video and generate a caption first.');return}let v=videos.find(x=>x.id===id);v.caption=window.currentCaption;save();toast('Caption saved to '+id+'.')}
function exportCSV(){let rows=[['ID','Title','Dealer','Language','Platform','Status','Owner','Due date'],...videos.map(v=>[v.id,v.title,v.dealer,v.language,v.platform,v.status,v.owner,v.due])];let csv=rows.map(r=>r.map(x=>'"'+String(x||'').replace(/"/g,'""')+'"').join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='dcl-production-tracker.csv';a.click();URL.revokeObjectURL(a.href);toast('Tracker exported as CSV.')}
render();
</script>
</body>
</html>
